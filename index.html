<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Key Hub System — Blood Strike</title>
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #12121a;
    --card: #16161f;
    --border: #26262f;
    --text: #e8e8ee;
    --muted: #8a8a99;
    --accent: #00e5ff;
    --accent2: #b14aff;
    --green: #00ff9d;
    --yellow: #f1c40f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow-x: hidden;
  }

  /* ===== HEADER ===== */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 40px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(12px);
    z-index: 100;
  }
  .logo { font-weight: 800; font-size: 1.2rem; letter-spacing: 1px; }
  .logo span { color: var(--accent); }
  .status {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.8rem; color: var(--green);
    border: 1px solid rgba(0,255,157,0.3);
    padding: 6px 14px; border-radius: 999px;
    background: rgba(0,255,157,0.05);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ===== MAIN CONTAINER ===== */
  .main-container {
    max-width: 520px;
    width: 100%;
    margin: 40px auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    flex: 1;
  }

  /* ===== VERIFY BOX ===== */
  .verify-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
  }
  .verify-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-weight: 700;
    font-size: 1.05rem;
  }
  .verify-header svg { color: var(--accent); width: 20px; height: 20px; flex-shrink: 0; }
  .verify-desc {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  .cloudflare-mock {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #1c1c28;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cf-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .cf-spinner {
    width: 24px; height: 24px;
    border: 3px solid rgba(0,229,255,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cf-text { font-size: 0.9rem; font-weight: 600; color: var(--accent); }
  .cf-logo { font-size: 0.75rem; font-weight: 800; color: #fa8128; letter-spacing: 0.5px; }

  /* ===== PRODUCT CARD ===== */
  .product-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    transition: all 0.3s;
  }
  .product-card:hover {
    border-color: var(--accent);
    box-shadow: 0 10px 30px rgba(0,229,255,0.1);
  }
  .product-banner {
    position: relative;
    height: 160px;
    background: linear-gradient(135deg, #2c1654, #12121a);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .product-banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.6;
  }
  .badge-link {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(241, 196, 15, 0.15);
    border: 1px solid rgba(241, 196, 15, 0.4);
    color: var(--yellow);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .product-info {
    padding: 20px;
  }
  .product-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .product-meta {
    display: flex;
    gap: 16px;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  .product-meta div {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .product-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  .btn-buy {
    background: rgba(0,255,157,0.1);
    border: 1px solid rgba(0,255,157,0.3);
    color: var(--green);
    font-weight: 700;
    padding: 12px;
    border-radius: 12px;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-buy:hover { background: rgba(0,255,157,0.2); }
  
  .btn-get {
    background: linear-gradient(135deg, #00b4db, var(--accent));
    color: #000;
    font-weight: 700;
    padding: 12px;
    border-radius: 12px;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-get:hover {
    opacity: 0.9;
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(0,229,255,0.3);
  }

  .btn-features {
    width: 100%;
    background: #1c1c26;
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 600;
    padding: 12px;
    border-radius: 12px;
    text-align: center;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-features:hover { border-color: var(--muted); }

  /* ===== FOOTER ===== */
  footer {
    text-align: center;
    padding: 24px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    header { padding: 14px 20px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">REAL<span>KID</span> HUB</div>
  <div class="status">
    <div class="dot"></div>
    SYSTEM ONLINE
  </div>
</header>

<!-- MAIN CONTENT -->
<div class="main-container">
  
  <!-- Xác minh bảo mật -->
  <div class="verify-box">
    <div class="verify-header">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/></svg>
      Xác minh bảo mật
    </div>
    <div class="verify-desc">Hoàn thành xác minh bên dưới để mở khóa Get Key</div>
    
    <div class="cloudflare-mock">
      <div class="cf-left">
        <div class="cf-spinner"></div>
        <div class="cf-text">Verificando...</div>
      </div>
      <div class="cf-logo">CLOUDFLARE</div>
    </div>
  </div>

  <!-- Product Card -->
  <div class="product-card">
    <div class="product-banner">
      <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=600&auto=format&fit=crop" alt="Blood Strike Banner">
      <div class="badge-link">⚡ 1 liên kết</div>
    </div>
    <div class="product-info">
      <div class="product-title">Blood Strike Global | VN</div>
      <div class="product-meta">
        <div>🕒 24h</div>
        <div>💻 1 Máy</div>
      </div>
      <div class="product-actions">
        <a href="#" class="btn-buy">🛒 Mua Key</a>
        <a href="#" class="btn-get">🔑 Lấy Key</a>
      </div>
      <a href="#" class="btn-features">📂 Tài Hack & Tính Năng</a>
    </div>
  </div>

</div>

<footer>
  © 2026 RealKid Hub — All rights reserved.
</footer>

</body>
</html>
